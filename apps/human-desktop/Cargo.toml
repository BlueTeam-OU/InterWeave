#
# The desktop human client (plan section 18): a thin composition root over
# crates/human/app-core, the human store, the transport facade on the IPC
# binding, and the ui-slint views. It names no Slint crate itself -- the
# toolkit is reached through ui-slint (the human-layering check, rule 4) --
# and no libp2p: the transport is the shared daemon's (ADR-0040).
[package]
name = "interweave-human-desktop"
version.workspace = true
publish = false
description = "The InterWeave desktop human client."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "human-desktop"
path = "src/main.rs"

[dependencies]
interweave-human-app-core = { path = "../../crates/human/app-core" }
interweave-human-store = { path = "../../crates/human/store" }
interweave-human-transport-client = { path = "../../crates/human/transport-client" }
interweave-human-ui-model = { path = "../../crates/human/ui-model" }
# The views with the desktop window: winit, the software renderer and the
# accessibility adapter (plan section 18 (14)).
interweave-human-ui-slint = { path = "../../crates/human/ui-slint", features = ["desktop"] }
interweave-local-client-api = { path = "../../crates/api/local-client-api" }
interweave-profile-config = { path = "../../crates/config/profile-config" }
interweave-transport-api = { path = "../../crates/api/transport-api" }

# The desktop IPC binding is Unix-only until the named pipe lands (plan
# section 18, Q12): elsewhere the app builds to a stub that says so.
[target.'cfg(unix)'.dependencies]
interweave-ipc-client = { path = "../../crates/local/ipc-client" }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros", "signal"] }
# TEST BUILDS ONLY, under `ui-trace`: the monotonic clock the trace's
# stamps read (src/trace.rs).
rustix = { workspace = true, features = ["time"], optional = true }

[features]
# TEST BUILDS ONLY: what the window shows, a line per change in kinds
# (ui-slint's trace.rs), on stderr with a monotonic stamp (src/trace.rs),
# for the desktop end-to-end case that times A5's Escape while the reader
# opens (tests/desktop-e2e/tests/human_app/opening.rs). Built only by that
# case's own command; no shipped build turns it on.
ui-trace = ["interweave-human-ui-slint/ui-trace", "dep:rustix"]

[dev-dependencies]
# The real view, headless: the app names no Slint crate in its own graph
# (dev-dependencies are not followed by the human-layering check).
i-slint-backend-testing = { workspace = true }
# The window's events and properties the fault tests drive and read.
slint = { workspace = true }
# A photo to store, prepared as the client prepares one.
image = { workspace = true }
# TEST-ONLY: the store faults of section 10's failure paths
# (tests/window_faults.rs). A dev-dependency's features reach the test
# builds alone; tools/checks/check_shipped_test_hooks.sh fails a shipped
# graph that resolves `test-hooks` anywhere.
interweave-human-app-core = { path = "../../crates/human/app-core", features = ["test-hooks"] }
interweave-local-client-fake = { path = "../../tests/local-client-fake" }
interweave-profile-identity = { path = "../../crates/identity/profile-identity" }
tempfile = { workspace = true }
