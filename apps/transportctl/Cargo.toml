# Copyright 2026 Andrea Benetton
#
# The admin client of a running daemon (over its admin socket, through
# ipc-client) and the offline identity commands (profile-identity with the
# profile lock, never a socket) -- plan §16 (1), (10).
[package]
name = "interweave-transportctl"
version.workspace = true
publish = false
description = "InterWeave transportctl: admin commands over the daemon's admin socket, and offline identity backup, verify and restore."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
# `--version` names the commit it was built from (ADR-0065 decision 6).
build = "../../tools/stamp/commit_stamp.rs"

[[bin]]
name = "transportctl"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
interweave-ipc-client = { path = "../../crates/local/ipc-client" }
interweave-local-client-api = { path = "../../crates/api/local-client-api" }
interweave-profile-config = { path = "../../crates/config/profile-config" }
interweave-profile-identity = { path = "../../crates/identity/profile-identity" }
interweave-transport-api = { path = "../../crates/api/transport-api" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "signal"] }
# Hidden phrase entry on a terminal (plan §16 (10); admitted 2026-09-28,
# confirmed 2026-10-01). Its Ctrl-C raise and its unzeroed reallocations
# are handled or stated in src/phrase.rs.
rpassword = "7.5.4"
# Already in the graph; held here so what rpassword returns is zeroed.
zeroize = "1.9.0"
# `endpoint adopt` (ADR-0067 decision 4) derives the public key from the
# secret a filesystem-custody record holds, to check it against the
# header before the record is copied. The workspace's version and the
# feature profile-config already compiles: no crate enters the graph.
ed25519-dalek = { workspace = true, features = ["zeroize"] }

[dev-dependencies]
tempfile = { workspace = true }
# The scripted admin socket of `tests/endpoint.rs`: the frame codec, so
# the script reads what the client really wrote. A types-and-codec crate.
interweave-ipc-protocol = { path = "../../crates/api/ipc-protocol" }
# TEST-ONLY: the old identity-key records `tests/endpoint.rs` plants are
# encoded byte by byte, as the human store wrote them, not through the
# encoder under test.
base64 = { workspace = true }
