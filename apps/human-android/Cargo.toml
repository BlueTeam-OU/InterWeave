#
# The Android human client (plan section 20): the native library the APK
# loads, the client's composition root on the phone, thin as the desktop
# one is. It names no Slint crate itself -- the toolkit is reached through
# ui-slint (the human-layering check, rule 4). The Gradle project that
# packages it is android/.
[package]
name = "interweave-human-android"
version.workspace = true
publish = false
description = "The InterWeave Android human client's native library."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "interweave_human_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
interweave-human-ui-model = { path = "../../crates/human/ui-model" }
# The app's log (src/platform_log.rs): the runtime's events, through the
# embedded host's own filter at the profile's level, to logcat. On every
# target so the host tests the filter the phone writes with; the filter
# comes through android-platform, the app's one way to the runtime.
interweave-human-android-platform = { path = "../../crates/human/android-platform" }
interweave-profile-config = { path = "../../crates/config/profile-config" }
# The store key's custody (src/keystore.rs) and the store's screens
# (src/store.rs): the store's KeyCipher seam and its at-rest actions. On
# every target for the identity keys' directory K1 reads
# (src/identity_keys.rs), which the host tests; android-platform brings
# the crate to the host already.
interweave-human-store = { path = "../../crates/human/store" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# The Service's hold on the runtime, store and facade, and the hub the
# Activity's view attaches to: android-platform, in [dependencies].
interweave-human-app-core = { path = "../../crates/human/app-core" }
# The views with Slint's Android backend over NativeActivity.
interweave-human-ui-slint = { path = "../../crates/human/ui-slint", features = ["android"] }
interweave-profile-identity = { path = "../../crates/identity/profile-identity" }
# The entry points the Kotlin side calls; the version Slint's Android
# backend already brings.
jni = { workspace = true }
# The platform's log, which a started Service without an Activity
# reaches only directly.
ndk-sys = { workspace = true }
# TEST BUILDS ONLY, under `e2e-cases`: the android-e2e cases the
# instrumentation runs in the app's process (src/e2e.rs), and the JSON
# their results travel as.
interweave-android-e2e-cases = { path = "../../tests/android-e2e-cases", optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# The identity key's record read back by the log and backup tests
# (src/platform_log.rs, src/identity_keys.rs), to look for its secret.
base64 = { workspace = true }
interweave-transport-api = { path = "../../crates/api/transport-api" }

[features]
# The first-run profile of crates/human/android-platform's stand_in, and
# a first run's identity created and Keystore-provisioned without asking
# (jni.rs passes FirstRun::Create under it), which the Gradle build turns
# on for the debug APK: without it a profile with no identity starts
# nothing.
dev-stand-ins = ["interweave-human-android-platform/dev-stand-ins"]
# TEST-ONLY: the instrumentation's case entry (src/e2e.rs,
# org.interweave.human.test.E2eCase.run). The Gradle build turns it on
# for the debug APK beside dev-stand-ins, whose first-run profile and
# identity a case starts on; the release build turns on neither.
e2e-cases = [
    "dev-stand-ins",
    "dep:interweave-android-e2e-cases",
    "dep:serde_json",
    "interweave-human-android-platform/e2e-cases",
]
