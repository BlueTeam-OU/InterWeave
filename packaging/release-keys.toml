ZW5ldHRvbkBibHVldGVhbS5lZT6IkwQTFgoAOxYhBH+5wnuqMTyuTB+UhazPpdm8
m09hBQJq83KOAhsDBQsJCAcCAiICBhUKCQgLAgQWAgMBAh4HAheAAAoJEKzPpdm8
m09hmWwA/RaC/lAjtIWGRVA+mIcjfwCwQB4ltC/ErYZNC+ebfDifAQC9fVJkY+sb
d+hSwJ0NIcvP+r0yQbePyS5DgCylfeurCA==
=b8Bg
-----END PGP PUBLIC KEY BLOCK-----
"""

[archive]
# The minisign public key that signs the Linux archive: the second line
# of the .pub file `minisign -G` writes, RW followed by 54 characters.
minisign_public_key = "RWThBWgfksKOWwyUdI0RKNXvsbRU5wqjGS3PPQc0oJ6R9rjV1kPoiJs4"
