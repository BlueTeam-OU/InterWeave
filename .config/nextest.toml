#
# cargo-nextest's configuration: how the `rust` job's Tests step runs the
# workspace tests (`cargo nextest run --profile ci`, under
# tools/ci/with_display.sh).
#
# WHAT NEXTEST CHANGES, against `cargo test`: every test runs in a process
# of its own, and tests of different binaries run at once (`cargo test`
# runs one binary at a time, its tests on threads). So a test that relies
# on sharing ITS PROCESS with its siblings, through a static, loses that
# here, and has to be named below. The statics in test targets when this
# was written (2026-10-16), and why each needs a group or nothing:
#
#   tests/desktop-e2e/tests/human_app/display.rs  FOCUS, a lock on the X
#       display's one input focus. Across processes it locks nothing.
#   tests/support/src/net.rs  HANDED_OUT, free_port never answering one
#       port twice in a process. No group: since #316 each answer also
#       holds a lock on a claim file for the rest of the process, so
#       another process is not answered it either (net.rs says how, and
#       names the tests that hold it). Before that, two tests in two
#       processes could be handed one port, and since libp2p-tcp listens
#       with SO_REUSEPORT both daemons bound it and shared it SILENTLY
#       (the #276 failure); #288 serialised every free_port caller CI
#       runs, the desktop-e2e and android-e2e packages, for it.
#   OnceLock registries, log sinks and counters (transport-contract's
#       schema_round_trip and negative_conformance, ipc-v2's wire,
#       ipc-protocol's schema_agreement, composition's trust_overlay and
#       endpoint_overlay, android-e2e's log_capture LINES and LEVEL,
#       claude_channel's and transport-client facade's NEXT message ids,
#       mdns_bounds' WATCHER_POLLS, TASKS_SPAWNED, TASKS_DROPPED and
#       RECOVERING_POLLS): built or counted per process instead of per
#       binary, and none serialises or deduplicates across tests, so the
#       same answer.
#
# No retries, deliberately: a test that passes on its second try failed,
# and nextest would report it as a pass.

[test-groups]
# desktop-e2e's human_app cases, one at a time: the X display's one input
# focus (FOCUS, above). The whole binary rather than the cases that take
# the lock, because every case that can call display::exclusive is in it
# (display.rs is its module), and a new one is then in the group without
# anyone adding it here. The other desktop-e2e binaries and android-e2e
# run beside everything else since #316.
end-to-end = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary_id(interweave-desktop-e2e-tests::human_app)'
test-group = 'end-to-end'

[profile.ci]
# Run every test and report the whole tally. `cargo test` stopped at the
# first failing binary, so a flake early in the run hid every later result.
fail-fast = false
# Say which tests are slow while they run, without ending any: the job's
# timeout-minutes is what stops a hang.
slow-timeout = { period = "60s" }
