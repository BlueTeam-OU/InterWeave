#
# Stage 20 (plan section 28 step 2, ADR-0055 decisions 2 and 5): two
# daemons on loopback, static bootstrap and mutual trust as a deployment
# renders them, and a generic automated TEST client -- any endpoint, any
# client kind, any channel the case configures; test-only, never a
# production dependency. Decision 5b's case (`tests/two_hosts.rs`) puts
# two daemons in two network namespaces joined by one private link
# (`interweave-test-support`'s overlay), Linux only.
# The binaries are the workspace's own build: run the workspace's tests, or
# build `interweave-transport-daemon` and `interweave-transportctl` first
# (every profile's key is minted by `transportctl identity init`) -- a
# missing binary fails the suite by name rather than skipping it.
[package]
name = "interweave-automated-client-tests"
version.workspace = true
publish = false
description = "What the transport promises an automated client: two InterWeave daemons on loopback and a generic test client."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
interweave-ipc-client = { path = "../../crates/local/ipc-client" }
interweave-local-client-api = { path = "../../crates/api/local-client-api" }
interweave-transport-api = { path = "../../crates/api/transport-api" }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
interweave-test-support = { path = "../support", features = ["e2e"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The ingress buckets' defaults, which the burst cases assert against.
interweave-transport-runtime = { path = "../../crates/transport/runtime" }
