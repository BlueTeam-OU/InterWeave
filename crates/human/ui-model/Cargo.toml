#
# The human client's UI model (plan §17 (6)): presentation state only.
# It reaches no store, no transport and no toolkit -- no rusqlite, no
# libp2p, no slint (plan §17 P2, the human-layering check) -- and names
# the client's vocabulary through interweave-human-client-api.
[package]
name = "interweave-human-ui-model"
version.workspace = true
publish = false
description = "The InterWeave human client's presentation state."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
interweave-human-chat-protocol = { path = "../chat-protocol", features = ["markdown"] }
interweave-human-client-api = { path = "../client-api" }
interweave-human-core = { path = "../core" }
interweave-transport-api = { path = "../../api/transport-api" }
# The card name rule counts after NFC; name_problem counts as it does.
unicode-normalization = { workspace = true }
# A Chats preview is cut between whole characters (`preview.rs`).
unicode-segmentation = { workspace = true }
# The one order contacts take everywhere (`order.rs`).
icu_collator = { workspace = true }
icu_normalizer = { workspace = true }
icu_provider = { workspace = true }

[features]
# TEST BUILDS ONLY: `UiModel::set_bounds_for_test`, which sets the session
# bound, the held-row ceiling and the read-proposal bound below their
# published figures, so a test reaches them with a few rows. Enabled by
# test crates as a dev-dependency feature; nothing that ships turns it
# on (architect-cto's A1 for j68: measured with `cargo tree -e features
# --edges normal -p <shipped package>`, recorded in the PR adding it).
test-hooks = []

[dev-dependencies]
# TEST-ONLY: this crate with its own `test-hooks` on, for its own tests.
interweave-human-ui-model = { path = ".", features = ["test-hooks"] }
interweave-human-store = { path = "../store" }
interweave-human-transport-client = { path = "../transport-client" }
interweave-local-client-fake = { path = "../../../tests/local-client-fake" }
interweave-profile-identity = { path = "../../identity/profile-identity" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
