#
# The reference views (plan §17 (8)): Slint components bound to ui-model.
# The only crate under crates/human whose graph names slint (P2).
[package]
name = "interweave-human-ui-slint"
version.workspace = true
publish = false
description = "The InterWeave human client's reference Slint views."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
interweave-human-client-api = { path = "../client-api" }
# The body's block tree, drawn as plain text (`body.rs`); the parser
# is ui-model's already, the feature is the same.
interweave-human-chat-protocol = { path = "../chat-protocol", features = ["markdown"] }
interweave-human-ui-model = { path = "../ui-model" }
# The `PeerId` a trust list's press names, held by identity as an item's
# press is: a neutral type, no transport behind it.
interweave-transport-api = { path = "../../api/transport-api" }
slint = { workspace = true }
# fontconfig opened at run time, not linked at build time (the workspace
# manifest says why); and, under `desktop`, the font stack `code_font`
# asks for the platform's monospaced family.
i-slint-common = { workspace = true }
# The image decoder the embedded window icon needs in every build of
# this crate, not only those a backend feature selects (the workspace
# manifest says why). Named for its feature; no code calls it.
i-slint-core = { workspace = true }
# The local time zone a message's time is shown in (`clock.rs`).
chrono = { workspace = true }
# The font stack's own loader, asked by `platform_check`.
yeslogic-fontconfig-sys = { workspace = true }

[features]
# The desktop window (plan section 18 (14), the owner's decision of
# 2026-10-04): winit with the software renderer and the platform
# accessibility adapter. Off by default, so the views' own tests and any
# crate that needs only the model build no windowing system; the desktop
# app turns it on. `unstable-winit-030` is the only public way to observe
# the window's focus (WinitWindowAccessor), which a read is gated on.
desktop = [
    "slint/backend-winit",
    "slint/renderer-software",
    # The swipe icons are paths (ui/app.slint SwipeIcon), which the
    # software renderer draws only with this; its crates are in the graph
    # already.
    "slint/software-renderer-path",
    "slint/accessibility",
    "slint/unstable-winit-030",
    # The font stack the renderer uses, asked for the platform's
    # monospaced family (`code_font`); already compiled by the software
    # renderer, so this names it rather than adding it.
    "i-slint-common/shared-fontique",
]
# The Android Activity (plan section 20 step 2): Slint's own backend over
# the platform's NativeActivity. It draws with Skia, whatever renderer
# feature is named (i-slint-backend-android-activity's window adapter), so
# none is: the desktop's software renderer would be compiled and unused.
# `slint/accessibility` is not named, because on this backend it switches
# nothing on: in Slint 1.18.1 it is `i-slint-backend-selector/accessibility`,
# which is `i-slint-backend-winit?/accessibility`, and winit is not in this
# graph; i-slint-backend-android-activity has no accessibility adapter.
# So TalkBack reads no tree from these views, and human-client-ui.md §13's
# "accessibility tree contains meaningful labels/actions" is unmet on
# Android (architect-cto, 2026-10-16: recorded, not waived) until an
# adapter is built for it.
# `i-slint-common/shared-fontique` is the font stack this backend lays text
# out with; the backend enables it already, and naming it here lets the
# views ask it which family "monospace" is, as the desktop does (#304 F4).
android = [
    "slint/backend-android-activity-06",
    "i-slint-common/shared-fontique",
]

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
i-slint-backend-testing = { workspace = true }
# The views compiled again by a test that fails on any warning
# (tests/compile.rs).
i-slint-compiler = { workspace = true }
spin_on = { workspace = true }
interweave-human-chat-protocol = { path = "../chat-protocol" }
interweave-human-core = { path = "../core" }
interweave-profile-identity = { path = "../../identity/profile-identity" }
interweave-transport-api = { path = "../../api/transport-api" }
# The render-parity golden is JSON (tests/render_parity.rs).
serde_json = { workspace = true }

[package.metadata.cargo-machete]
# slint-build is a BUILD dependency, called from build.rs to compile
# ui/app.slint; `cargo-machete --with-metadata` reports it unused.
# i-slint-core is named only to turn on its image decoder.
ignored = ["slint-build", "i-slint-core"]
