#
# The human client's headless root (Stage 15, architect-cto's Q1 ruling,
# relay seq 11163): the Command/Update protocol between the facade and the
# model, with the facade side and the model side that speak it. No tokio,
# no toolkit, no platform and no rusqlite of its own -- the store is
# reached through the facade -- so desktop wires it today and Android
# reuses it at Stage 17.
[package]
name = "interweave-human-app-core"
version.workspace = true
publish = false
description = "The InterWeave human client's headless composition core."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
interweave-human-chat-protocol = { path = "../chat-protocol" }
interweave-human-client-api = { path = "../client-api" }
interweave-human-store = { path = "../store" }
interweave-human-transport-client = { path = "../transport-client" }
interweave-human-ui-model = { path = "../ui-model" }
interweave-local-client-api = { path = "../../api/local-client-api" }
# The profile a root reads: which endpoints its client may lease.
interweave-profile-config = { path = "../../config/profile-config" }
interweave-transport-api = { path = "../../api/transport-api" }
# A sent message's application id: 128 random bits.
rand = { workspace = true }
image = { workspace = true }

[features]
# TEST BUILDS ONLY: `test_hooks` -- faults laid on the facade's windowed
# reads (a page or the contacts failing or held, a photo slowed or
# unreadable) through `FacadeSide::with_store_faults`, and the model's
# lower bounds through `ModelSide::set_bounds_for_test` (ui-model's own
# `test-hooks`). Enabled by test crates as a dev-dependency feature;
# nothing that ships turns it on (architect-cto's A1 for j68).
test-hooks = ["interweave-human-ui-model/test-hooks"]

[dev-dependencies]
# TEST-ONLY: this crate with its own `test-hooks` on, for its own tests.
interweave-human-app-core = { path = ".", features = ["test-hooks"] }
# The identity-key record's secret, read back to grep the store for it.
base64 = { workspace = true }
interweave-profile-config = { path = "../../config/profile-config" }
interweave-local-client-fake = { path = "../../../tests/local-client-fake" }
interweave-profile-identity = { path = "../../identity/profile-identity" }
# Corrupts a stored row, in one test, to drive a store failure.
rusqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
# A test cipher answers its secret in the seam's own wrapper.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
