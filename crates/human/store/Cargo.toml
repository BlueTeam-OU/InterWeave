# Copyright 2026 Andrea Benetton
#
# The durable side of ADR-0044. `interweave-human-core` decides
# `Durability`; this crate is the thing that carries it out, and the split
# is what lets the decision be tested by enumeration and the storage be
# tested against a real file that gets reopened.
#
# THREE CONTENT TABLES, and no fourth. `pending_outbound`, `unread_inbound`,
# `kept_inbound` — there is deliberately no `messages` or
# `conversation_history` table, because a general history table is the
# shape the retention contract exists to forbid, and one added "for the
# UI" would violate it silently.
[package]
name = "interweave-human-store"
version = "0.0.0"
publish = false
description = "Durable ADR-0044 retention storage for the InterWeave human client."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
interweave-human-core = { path = "../core" }
interweave-transport-api = { path = "../../api/transport-api" }
# The private-directory rule (ADR-0028 A 2026-10-08): the state directory
# is judged, ancestors and links with it, by profile-config's one walk
# rather than by a copy here -- a second copy of the rule is a second
# place for it to drift.
interweave-profile-config = { path = "../../config/profile-config" }
# SQLCipher, compiled here (the workspace's `rusqlite`, ADR-0060): the
# desktop and Android clients run the SAME engine, and the store is
# encrypted at rest under its key (`store_key.rs`). A system library would
# make the storage engine a property of the host rather than of the release;
# `tests/storage_mechanics.rs` pins that the engine is SQLCipher.
rusqlite = { workspace = true }
# Each identity's own key pair (ADR-0063, identity_key.rs): signing, and
# its secret zeroized on drop. `legacy_compatibility` stays off here as in
# chat-protocol, whose S-plus-order card fails the moment it is on.
ed25519-dalek = { workspace = true, features = ["zeroize"] }
base64 = { workspace = true }
# `SysRng`: the key's 32 bytes come from the system's CSPRNG directly.
rand = { workspace = true }
sha2 = { workspace = true }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[features]
# The rewrite's crash points (`at_rest::RewriteStep`): a test build ends
# the process after the step `INTERWEAVE_STORE_CRASH_AFTER` names, as a
# kill would. Enabled by this crate's own tests below and by no client;
# a workspace-wide test build unifies it into every test's copy of the
# store, where it is inert without the variable.
crash-points = []

[dev-dependencies]
# This crate with its crash points, for tests/at_rest.rs.
interweave-human-store = { path = ".", features = ["crash-points"] }
tempfile = { workspace = true }
# A software stand-in for the Keystore's AES-256-GCM key in
# tests/identity_key.rs; the version the embedded host's tests use.
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
