#
# The Android human client's platform side (plan section 20 steps 2-4):
# the Service's hold on the embedded runtime, the store and the facade,
# and the hub the Activity's view and the notifications meet it at. No
# Android, JNI or Slint type, so it is built and tested on the host; the
# JNI entry points and the views are apps/human-android's.
[package]
name = "interweave-human-android-platform"
version = "0.0.0"
publish = false
description = "The InterWeave Android human client's Service side: runtime, store and facade, host-testable."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# BIP-39's English list for the recovery-phrase picker; the same pin
# profile-identity encodes the phrase with.
bip39 = { workspace = true }
interweave-human-app-core = { path = "../app-core" }
interweave-human-store = { path = "../store" }
interweave-human-transport-client = { path = "../transport-client" }
interweave-local-client-api = { path = "../../api/local-client-api" }
interweave-profile-config = { path = "../../config/profile-config" }
interweave-profile-identity = { path = "../../identity/profile-identity" }
interweave-transport-api = { path = "../../api/transport-api" }
interweave-transport-embedded = { path = "../../transport/embedded" }
# Under `e2e-cases`, off by default: the android-e2e cases' recorder and
# client handle (src/e2e.rs), a test crate. That no release build turns
# the feature on is checked twice: check_human_layering rule 6 fails if
# apps/human-android's default graph reaches the case crate, and the
# app's Gradle task verifyReleaseNative fails on a release library that
# carries the case entry.
interweave-android-e2e-cases = { path = "../../../tests/android-e2e-cases", optional = true }
# The facade's command channel and its turn timer, on the embedded
# runtime's executor.
tokio = { workspace = true, features = ["sync", "time", "macros"] }
# C3's two check positions.
rand = { workspace = true }

[features]
# The first-run profile, until profile-config's provisioning lands
# (src/stand_in.rs). Off by default; the app's debug build turns it on.
dev-stand-ins = []
# TEST-ONLY: end the runtime from a test (ServiceHost::end_runtime_for_test),
# through the embedded host's own hook; this crate's tests turn it on.
test-hooks = ["interweave-transport-embedded/test-hooks"]
# TEST-ONLY: the app's service started with a payload recorder
# (ServiceHost::start_recording) and the hub as a case's client
# (e2e::HubClient), for tests/android-e2e's human_chat on the phone's
# instrumentation and on the host. Off by default: this crate's own
# tests, tests/android-e2e and the app's debug build (for its
# instrumentation) turn it on; its release build never does.
e2e-cases = ["dep:interweave-android-e2e-cases"]

[dev-dependencies]
interweave-human-chat-protocol = { path = "../chat-protocol" }
interweave-human-client-api = { path = "../client-api" }
interweave-human-core = { path = "../core" }
interweave-human-ui-model = { path = "../ui-model" }
# The stand-ins on for this crate's own tests, as composition's test hooks
# are: the service is started the way the debug APK starts it.
interweave-human-android-platform = { path = ".", features = ["dev-stand-ins", "e2e-cases", "test-hooks"] }
tempfile = { workspace = true }
# The test stand-in for the store key's Keystore answers a zeroized key.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
