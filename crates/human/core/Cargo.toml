#
# The ADR-0044 retention state machine, the client's local identifiers,
# and the same-name rule the store and the model both ask.
#
# NOTE WHAT IS ABSENT: no dependency on chat-protocol, transport-api, or
# any store. The retention decision cannot see message content, a sender,
# an EndpointId, or a contact — so "a remote sender cannot request or
# force retention" is not a rule this crate follows, it is a rule the
# dependency graph makes unstateable. It decides `Durability`; a store
# carries it out, which is also what lets every transition be tested by
# enumeration.
[package]
name = "interweave-human-core"
version.workspace = true
publish = false
description = "Human client domain state: the ADR-0044 message retention state machine and the same-name rule."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
# When two names are the same name (`names.rs`, contact-cards design
# 5.4.1): NFKC, full case folding and Unicode TS #39's confusable
# skeleton. Pure functions over a string: no contact, sender or store.
caseless = { workspace = true }
unicode-normalization = { workspace = true }
unicode-security = { workspace = true }

[dev-dependencies]
