# Copyright 2026 Andrea Benetton
#
# The release run (ADR-0057, plan §22): a tag v<version> on main, the
# version a Semantic Versioning 2.0.0 one and the workspace's (ADR-0065),
# builds the signed Android APK and the Linux archive and publishes them,
# with the release page, as the tag's release; a pre-release tag
# (v0.4.0-rc.1) publishes as a pre-release, never as the latest
# (tools/ci/release_publish.sh, test_release_publish.sh). The steps, and
# their order, are packaging/android/README.md's "The release run"; every
# one is a tools/ci script with a self-test beside it, so this file holds no
# release logic of its own -- only where each script runs, what it is
# handed, and which job may hold what.
#
# Six jobs, so that no job holds both the signing key and a token that
# can write to the repository, and no job holding the key runs the build:
#   tag      refuses a tag that is not v<MAJOR>.<MINOR>.<PATCH>[-<pre>],
#            not the workspace version, not on main, or not signed by the
#            pinned tag key, before anything else starts
#            (tools/ci/release_tag.sh, release_verify_tag.sh and their
#            self-tests)
#   apk      steps 2-4 and 7: the unsigned APK and the notices; no secrets
#   linux    step 6, in the glibc floor's image (ubuntu:22.04, glibc
#            2.35), every program held to the floor; no secrets
#   linux-run every program of the archive started in a clean image of
#            the floor; no secrets
#   sign     step 5, once every check job above has passed: the tag
#            checked again with main's verifier and pin, then the release
#            environment's secrets, a read-only token, and nothing run but
#            the toolchain install and the signing
#   publish  steps 8-9 and the provenance attestation of the APK and the
#            archive: contents: write, id-token and attestations write,
#            no secrets, builds nothing
# Steps 2-7 are run in the README's order within a job; the page that
# consumes them is filled only once every one has finished.
#
# A DRY RUN is a workflow_dispatch on main with a version: tag, linux and
# linux-run run, at that version and the dispatched commit, and the archive is the
# run's artifact. The version is held to the tag rule, the workspace's
# included, so it is the one in main's Cargo.toml. apk, sign and publish do not run, so a dry run reads no
# secret, holds no write token and publishes nothing; it is how a host
# procedure is tested against a real archive before a tag exists.
#   gh workflow run release.yml --ref main -f version=<workspace version>
# then `gh run download <run id> -n linux` for the archive, its .sha256
# and linux-values.json, kept seven days.
#
# Not part of CI's required contexts: this workflow runs on a tag or a
# dispatch, never on a pull request or the merge queue, so nothing here
# gates main and check_required_contexts.sh has nothing to hold it to.
#
# What stays the owner's, in the `release` environment:
#   secrets   INTERWEAVE_RELEASE_KEYSTORE_BASE64 (the keystore file,
#             base64; the run writes it out and sets
#             INTERWEAVE_RELEASE_KEYSTORE to its path),
#             INTERWEAVE_RELEASE_KEY_ALIAS, INTERWEAVE_RELEASE_KEYSTORE_PASS,
#             INTERWEAVE_RELEASE_KEY_PASS (if it differs),
#             INTERWEAVE_RELEASE_CERT_SHA256 -- packaging/android/README.md,
#             "The signing key", says what each holds;
#             INTERWEAVE_RELEASE_MINISIGN_KEY (the archive key's secret
#             file) and INTERWEAVE_RELEASE_MINISIGN_PASS, whose public
#             half packaging/release-keys.toml pins;
#   variable  INTERWEAVE_RELEASE_FIRST=true for the first release only,
#             with no INTERWEAVE_RELEASE_CERT_SHA256: the run passes
#             --first-release and prints the fingerprint to record, and the
#             variable is then removed. With neither, the signing refuses;
#   protection a deployment rule admitting only v* tags, and a required
#             reviewer. The tag job runs from the tagged commit's own copy
#             of this file and its scripts; the sign job checks the tag
#             again with main's verifier and pin, but its steps are still
#             this file's tagged copy, so a writer who tags a commit with
#             an edited copy can drop that step too, and only the
#             environment's reviewer keeps the key from such a run.

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'The workspace version to build as, without the v (a dry run: nothing is signed or published)'
        required: true
        type: string

permissions:
  contents: read

# bash -eo pipefail, which an unset shell is not.
defaults:
  run:
    shell: bash

concurrency:
  # One run per tag, never cancelled: a half-published release is worse
  # than a second run refused by gh release create. The trigger is in the
  # group, so a dry run never queues behind, or displaces, a tag's run.
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: release tag
    runs-on: ubuntu-latest
    # The pinned toolchain's install, for cargo metadata, is most of it.
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      # A dispatch's version is checked as a tag would be; it reaches the
      # script through the environment, never into the script's text.
      TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
      EVENT: ${{ github.event_name }}
      REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # main's history, to ask whether the tag is on it.
          fetch-depth: 0

      # cargo metadata reads the tagged commit's manifests with it.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The trigger's glob admits v01.2.3 and v1.2.3+build; release_tag.sh
      # holds the tag to the Semantic Versioning grammar without build
      # metadata and to the workspace version at the tagged commit
      # (ADR-0065 decisions 5 and 6), and a tag off main would pass it, so
      # that is refused here; every other job needs this. A dry run is held
      # to the same, and is dispatched from main itself: a branch whose
      # head is on main's history would pass the ancestry check alone. A
      # refused version is printed %q-quoted, since a dispatched one is
      # typed text and a newline in it would otherwise start a workflow
      # command of its own in the log.
      - name: The tag is the workspace version, and on main
        id: version
        run: |
          if [[ "$EVENT" == workflow_dispatch && "$REF" != refs/heads/main ]]; then
            printf '::error::a dry run is dispatched from main, not %q\n' "$REF"; exit 1
          fi
          out=$(bash tools/ci/release_tag.sh "$TAG") || { printf '%s\n' "$out"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { printf '::error::tag %q (%s) is not on main\n' "$TAG" "$GITHUB_SHA"; exit 1; }
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"

      # The tag is the owner's act: signed by the pinned tag key
      # (packaging/release-keys.toml), checked with a keyring made for
      # this step that holds that key alone. With no key pinned every tag
      # is refused. This reads the tagged commit's copy of the pin and the
      # script; the sign job checks again with main's (below). A dry run
      # has no tag to check.
      - name: The tag is signed by the pinned key
        if: github.event_name == 'push'
        run: |
          # The pinned key first, by itself, so that a run with none
          # pinned says so before anything is fetched.
          python3 tools/ci/release_keys.py packaging/release-keys.toml tag.fingerprint
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"
          bash tools/ci/release_verify_tag.sh "$TAG" "$GITHUB_SHA"

  apk:
    name: release apk build (arm64-v8a)
    needs: tag
    # Never on a dry run: it builds only what a host install reads.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cargo or Gradle cache, deliberately: skia_prebuilt.sh check
      # reads every skia-bindings output of the release profile, and a
      # restored target can carry one the build did not take. A release
      # builds from nothing.
      - name: Install the pinned JDK, SDK packages, Rust target and cargo-ndk
        run: bash tools/ci/android_ci_toolchain.sh jdk sdk rust cargo-ndk

      # Step 2: the one Skia archive the pin names, its SHA-256 checked.
      - name: Skia, pinned
        run: |
          out=$(bash tools/ci/skia_prebuilt.sh fetch "$RUNNER_TEMP/skia") || exit 1
          printf '%s\n' "$out"
          line=$(printf '%s\n' "$out" | grep '^SKIA_BINARIES_URL=file://') || true
          [ "$(printf '%s' "$line" | grep -c .)" = 1 ] \
            || { echo "::error::skia_prebuilt.sh fetch printed no single SKIA_BINARIES_URL line"; exit 1; }
          printf '%s\n' "$line" >> "$GITHUB_ENV"

      # Step 3. Gradle runs cargo-ndk --release for arm64-v8a.
      - name: ./gradlew assembleRelease
        working-directory: apps/human-android/android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      # Step 4: a silent fallback to a source build is a red run.
      - name: Skia, checked
        run: bash tools/ci/skia_prebuilt.sh check target release

      # Step 7, here because an ndk: source reads this job's SDK. The
      # script writes its file and makes no directory for it.
      - name: The notices
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 tools/ci/skia_notices.py "$RUNNER_TEMP/out/notices.json"

      # ADR-0058 decision 5 (A 2026-10-22 (ii)): the notices of every crate
      # compiled into the native library, made by the tool and rule the
      # Linux archive's are, as THIRD-PARTY-NOTICES-android.md, a release
      # asset beside the APK -- about six times what a release body takes,
      # so the page holds only its link and hash (crate-notices.json). The
      # link is the release's download URL, run.json's base for the APK.
      # No build needed: cargo resolves the library's graph from the lock.
      - name: The native library's crate notices
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          bash tools/ci/release_crate_notices.sh aarch64-linux-android interweave-human-android \
            "$VERSION" "$RUNNER_TEMP/out" "$BASE"

      # One directory for the artifact: given paths in two, upload-artifact
      # roots it at their common ancestor, and the files arrive nested
      # under it rather than where sign and publish read them.
      - name: The unsigned APK beside the notices
        run: cp apps/human-android/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/out/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-unsigned
          path: |
            ${{ runner.temp }}/out/app-release-unsigned.apk
            ${{ runner.temp }}/out/notices.json
            ${{ runner.temp }}/out/crate-notices.json
            ${{ runner.temp }}/out/THIRD-PARTY-NOTICES-android.md
            ${{ runner.temp }}/out/THIRD-PARTY-NOTICES-android.md.sha256
          if-no-files-found: error
          retention-days: 7

  sign:
    name: release apk signing
    # After every check job, linux and linux-run included: a run refused
    # at any check (the Linux archive's notices, or a program that does not
    # start at the floor) leaves no signed APK, not even as a run artifact.
    needs: [tag, apk, linux, linux-run]
    # Never on a dry run: the job that reads the key runs only for a tag.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # main's tip beside the tag's tree, after it: a checkout into the
      # workspace root would remove it. Its history answers whether the
      # tagged commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          path: main-tip
          fetch-depth: 0

      # The tag job's checks ran from the tagged commit's own copy, which
      # a tag of an edited commit carries edited. Before the key is read:
      # main's verifier, main's pin, and main's history -- what changes
      # only as a reviewed diff. The workflow file is still the tag's,
      # which the environment's required reviewer is left to check
      # (packaging/android/README.md, step 5).
      - name: The tag is on main and signed by main's pinned key
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git -C main-tip merge-base --is-ancestor "$GITHUB_SHA" HEAD \
            || { echo "::error::$GITHUB_SHA is not on main's tip"; exit 1; }
          git -C main-tip fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"
          bash main-tip/tools/ci/release_verify_tag.sh --keys main-tip/packaging/release-keys.toml \
            --repo main-tip "$TAG" "$GITHUB_SHA"

      # The JDK for keytool, the SDK for build-tools and android.jar; no
      # build runs in this job.
      - name: Install the pinned JDK and SDK packages
        run: bash tools/ci/android_ci_toolchain.sh jdk sdk

      # release_android_apk.sh otherwise takes the newest build-tools
      # under $ANDROID_HOME, which is the runner image's, not the pin's.
      - name: The pinned build-tools for signing
        run: |
          v=$(sed -n 's/^PKG_[0-9]*=build-tools;\([^@]*\)@.*/\1/p' tools/host/android/android-toolchain.pins | sort -V | tail -n 1)
          [ -n "$v" ] && [ -d "$ANDROID_HOME/build-tools/$v" ] \
            || { echo "::error::no pinned build-tools in $ANDROID_HOME"; exit 1; }
          echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/$v" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-unsigned
          path: ${{ runner.temp }}/unsigned

      # Step 5. The keystore is a file only this job reads, under the
      # runner's temporary directory, and is removed however the job ends
      # (the step after). The passwords stay in the environment; the
      # script hands them to apksigner as env: references.
      - name: Signing
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          KEYSTORE_B64: ${{ secrets.INTERWEAVE_RELEASE_KEYSTORE_BASE64 }}
          INTERWEAVE_RELEASE_KEY_ALIAS: ${{ secrets.INTERWEAVE_RELEASE_KEY_ALIAS }}
          INTERWEAVE_RELEASE_KEYSTORE_PASS: ${{ secrets.INTERWEAVE_RELEASE_KEYSTORE_PASS }}
          INTERWEAVE_RELEASE_KEY_PASS: ${{ secrets.INTERWEAVE_RELEASE_KEY_PASS }}
          INTERWEAVE_RELEASE_CERT_SHA256: ${{ secrets.INTERWEAVE_RELEASE_CERT_SHA256 }}
          FIRST_RELEASE: ${{ vars.INTERWEAVE_RELEASE_FIRST }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::the release environment has no INTERWEAVE_RELEASE_KEYSTORE_BASE64"; exit 1; }
          export INTERWEAVE_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          ( umask 077 && printf '%s' "$KEYSTORE_B64" | base64 -d > "$INTERWEAVE_RELEASE_KEYSTORE" ) \
            || { echo "::error::INTERWEAVE_RELEASE_KEYSTORE_BASE64 is not base64"; exit 1; }
          first=()
          [ "$FIRST_RELEASE" = true ] && first=(--first-release)
          bash tools/ci/release_android_apk.sh "${first[@]}" "$VERSION" \
            "$RUNNER_TEMP/unsigned/app-release-unsigned.apk" "$RUNNER_TEMP/out"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: ${{ runner.temp }}/linux

      # The Linux archive and its .sha256, signed with the archive key and
      # each signature verified with main's pinned public key before it is
      # kept (tools/ci/release_sign_archive.sh): a .sha256 beside the
      # archive in the same release catches corruption and authenticates
      # nothing. minisign is the pinned build, from main's pin; the key is
      # a file only the script reads, removed however it ends.
      - name: The archive's signatures
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          INTERWEAVE_RELEASE_MINISIGN_KEY: ${{ secrets.INTERWEAVE_RELEASE_MINISIGN_KEY }}
          INTERWEAVE_RELEASE_MINISIGN_PASS: ${{ secrets.INTERWEAVE_RELEASE_MINISIGN_PASS }}
        run: |
          bash main-tip/tools/ci/minisign_install.sh "$RUNNER_TEMP/minisign"
          archive="$RUNNER_TEMP/linux/interweave-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
          # signing-values.json: the key the signatures were verified
          # with, for the page's minisign check.
          MINISIGN="$RUNNER_TEMP/minisign/minisign" bash main-tip/tools/ci/release_sign_archive.sh \
            --keys main-tip/packaging/release-keys.toml --values "$RUNNER_TEMP/out/signing-values.json" \
            "$archive" "$archive.sha256"
          # Into the APK's directory: one directory for the artifact, as
          # the apk job's comment says why.
          cp "$archive.minisig" "$archive.sha256.minisig" "$RUNNER_TEMP/out/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: |
            ${{ runner.temp }}/out/interweave-*-arm64-v8a.apk
            ${{ runner.temp }}/out/interweave-*-arm64-v8a.apk.sha256
            ${{ runner.temp }}/out/android-values.json
            ${{ runner.temp }}/out/interweave-*-x86_64-unknown-linux-gnu.tar.gz.minisig
            ${{ runner.temp }}/out/interweave-*-x86_64-unknown-linux-gnu.tar.gz.sha256.minisig
            ${{ runner.temp }}/out/signing-values.json
          if-no-files-found: error
          # The signed APK, kept a day: publish runs straight after this
          # job, and a publish re-run later than that is a full re-run,
          # which signs again behind the environment's required reviewer.
          retention-days: 1

  linux:
    name: release archive (x86_64-unknown-linux-gnu, glibc 2.35)
    needs: tag
    runs-on: ubuntu-latest
    # The archive's glibc floor, 2.35 on x86_64 (ADR-0065 A 2026-10-25):
    # built in that glibc's own image, so what the programs link against
    # is what the floor has, never the runner's newer one (v0.1.0's
    # human-desktop needed GLIBC_2.43 from ubuntu-latest). The image is
    # pinned by its index digest, and is linux-run's too; a new floor is
    # a new image here and there and GLIBC_FLOOR, together.
    container:
      image: ubuntu:22.04@sha256:0a9887931b0e38af2e3487ed39e29436b0535c4f3f52e57745baaf79d1898956
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      GLIBC_FLOOR: "2.35"
    steps:
      # Before the checkout, which takes a git clone only when git is
      # there; the archive script reads the commit time with git. jammy's
      # python3 is 3.10 and the release scripts read TOML with tomllib, so
      # its python3.11 is python3. No -dev headers: fontconfig and the
      # display libraries are loaded at run time, not linked. apt's
      # retries and timeouts are `tools/ci/apt_install.sh conf`'s lines,
      # written into the job's own container since the script is not
      # checked out yet (test_apt_install.sh fails when they differ); no
      # .deb cache, since a tag's run restores only what main saved and
      # nothing on main installs this image's packages.
      - name: The build image's packages, and its glibc is the floor
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            > /etc/apt/apt.conf.d/80-ci-retries
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            build-essential ca-certificates curl git python3.11
          ln -sf /usr/bin/python3.11 /usr/local/bin/python3
          got="$(getconf GNU_LIBC_VERSION)"
          [ "$got" = "glibc $GLIBC_FLOOR" ] \
            || { echo "::error::the build image has $got, not the floor glibc $GLIBC_FLOOR"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The container runs as root over a checkout the runner's user owns,
      # which git otherwise refuses to read.
      - name: git reads the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # rustup itself at the pin the Android hosts use, its SHA-256
      # checked; then the toolchain rust-toolchain.toml names.
      - name: Install the pinned toolchain
        run: |
          pins=tools/host/android/android-toolchain.pins
          v="$(sed -n 's/^RUSTUP_VERSION=//p' "$pins")"
          sha="$(sed -n 's/^RUSTUP_INIT_SHA256=//p' "$pins")"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/$v/x86_64-unknown-linux-gnu/rustup-init"
          echo "$sha  $RUNNER_TEMP/rustup-init" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --no-modify-path --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install

      # Step 6. The archive script also writes the archive's
      # THIRD-PARTY-NOTICES.md: it runs tools/ci/release_notices.py over
      # `cargo tree --locked` of the packages it ships and `cargo
      # metadata --locked`, and a failure there fails this step with no
      # archive left behind. Not a step of its own: the notices are a file
      # inside the archive, built from the archive's own scratch. Every
      # staged program is held to the floor (check_glibc_floor.py) before
      # the tar. The output is under the workspace: in a container job the
      # runner.temp context names the host's path, not the container's.
      - name: The Linux archive
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: bash tools/ci/release_linux_archive.sh --glibc-floor "$GLIBC_FLOOR" "$VERSION" release-out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            release-out/interweave-*-x86_64-unknown-linux-gnu.tar.gz
            release-out/interweave-*-x86_64-unknown-linux-gnu.tar.gz.sha256
            release-out/linux-values.json
          if-no-files-found: error
          retention-days: 7

  linux-run:
    name: release archive runs at glibc 2.35
    needs: [tag, linux]
    runs-on: ubuntu-latest
    # The floor image again, clean: nothing installed, so a program that
    # starts here needs no more than the floor and the base image give.
    container:
      image: ubuntu:22.04@sha256:0a9887931b0e38af2e3487ed39e29436b0535c4f3f52e57745baaf79d1898956
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      # No git in the image: the checkout downloads the commit's files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: release-in

      # Every program started with LD_BIND_NOW=1: what check_glibc_floor.py
      # does not read (libgcc_s, libstdc++) fails here before main.
      - name: Every program runs
        run: bash tools/ci/release_linux_run.sh "release-in/interweave-$VERSION-x86_64-unknown-linux-gnu.tar.gz"

  publish:
    name: publish the release
    needs: [tag, apk, sign, linux, linux-run]
    # Never on a dry run, which publishes nothing.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # The provenance attestation below: a Sigstore certificate for this
      # run's identity, and the attestation stored on the repository.
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.tag.outputs.version }}
      PRERELEASE: ${{ needs.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The signed APK, the archive and their values; the notices from the
      # build. The unsigned APK comes along and is never published.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/in
          merge-multiple: true

      # run.json: the version, the notes and the two download URLs. The
      # notes are the tag's whole message, its first paragraph included,
      # so the tag must be annotated: a lightweight tag would publish the
      # commit's message as notes.
      - name: The run's values
        env:
          REPO: ${{ github.repository }}
        run: |
          # The tag object itself, whatever form checkout left the ref in.
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git cat-file -t "refs/tags/$TAG")" = tag ] \
            || { echo "::error::$TAG is not an annotated tag; its message is the release notes"; exit 1; }
          # %(contents) is the message as written, with a signed tag's
          # signature after it; the signature is not notes.
          notes=$(git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d')
          base="https://github.com/$REPO/releases/download/$TAG"
          jq -n --arg v "$VERSION" --arg n "$notes" \
            --arg a "$base/interweave-$VERSION-arm64-v8a.apk" \
            --arg l "$base/interweave-$VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            '{version: $v, release_notes: $n, apk_url: $a, linux_archive_url: $l}' > "$RUNNER_TEMP/run.json"

      # Step 8: refuses a gap, a stray value, a value two files give, and
      # a hash made for another version.
      - name: The page
        run: |
          in="$RUNNER_TEMP/in"
          python3 tools/ci/release_page.py apps/human-android/release/release-page.md.in \
            "$RUNNER_TEMP/page.md" "$RUNNER_TEMP/run.json" \
            "$in/android-values.json" "$in/linux-values.json" "$in/notices.json" \
            "$in/crate-notices.json" "$in/signing-values.json"

      # Before anything is created: a page the API would refuse fails here,
      # its size and the limit named, not at gh release create with the tag
      # already pushed (ADR-0058 A 2026-10-22 (ii)).
      - name: The page fits a release body
        run: bash tools/ci/check_release_body.sh "$RUNNER_TEMP/page.md"

      # A provenance attestation for the APK and the archive, each by its
      # SHA-256: the repository, the workflow file at the tagged commit,
      # the run and its trigger, signed by Sigstore for this run's
      # identity. Anyone checks one with
      #   gh attestation verify <file> --repo BlueTeam-OU/InterWeave
      # It records where a file was built, not that the build is the one
      # the source describes; the toolchain and the locks are the tagged
      # commit's, which the attestation names.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/in/interweave-*-arm64-v8a.apk
            ${{ runner.temp }}/in/interweave-*-x86_64-unknown-linux-gnu.tar.gz

      # Step 9: tools/ci/release_publish.sh creates the tag's release, a
      # pre-release tag marked as one and never as the latest release
      # (ADR-0065 decision 6; test_release_publish.sh).
      - name: Publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/ci/release_publish.sh "$TAG" "$VERSION" "$PRERELEASE" "$RUNNER_TEMP/page.md" "$RUNNER_TEMP/in"
