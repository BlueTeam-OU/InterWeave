# Copyright 2026 Andrea Benetton
#
# The release run (ADR-0057, plan §22): a tag v<MAJOR>.<MINOR>.<PATCH> on
# main builds the signed Android APK and the Linux archive and publishes
# them, with the release page, as the tag's release. The steps, and their
# order, are packaging/android/README.md's "The release run"; every one is
# a tools/ci script with a self-test beside it, so this file holds no
# release logic of its own -- only where each script runs, what it is
# handed, and which job may hold what.
#
# Five jobs, so that no job holds both the signing key and a token that
# can write to the repository, and no job holding the key runs the build:
#   tag      refuses a tag that is not v<MAJOR>.<MINOR>.<PATCH> or not on
#            main, before anything else starts
#   apk      steps 2-4 and 7: the unsigned APK and the notices; no secrets
#   linux    step 6; no secrets
#   sign     step 5, once every check job above has passed: the release
#            environment's secrets, a read-only token, and nothing run but
#            the toolchain install and the signing
#   publish  steps 8-9: contents: write, no secrets, builds nothing
# Steps 2-7 are run in the README's order within a job; the page that
# consumes them is filled only once every one has finished.
#
# A DRY RUN is a workflow_dispatch on main with a version: tag and linux
# run, at that version and the dispatched commit, and the archive is the
# run's artifact. apk, sign and publish do not run, so a dry run reads no
# secret, holds no write token and publishes nothing; it is how a host
# procedure is tested against a real archive before a tag exists.
#   gh workflow run release.yml --ref main -f version=0.0.0
# then `gh run download <run id> -n linux` for the archive, its .sha256
# and linux-values.json, kept seven days.
#
# Not part of CI's required contexts: this workflow runs on a tag or a
# dispatch, never on a pull request or the merge queue, so nothing here
# gates main and check_required_contexts.sh has nothing to hold it to.
#
# What stays the owner's, in the `release` environment:
#   secrets   INTERWEAVE_RELEASE_KEYSTORE_BASE64 (the keystore file,
#             base64; the run writes it out and sets
#             INTERWEAVE_RELEASE_KEYSTORE to its path),
#             INTERWEAVE_RELEASE_KEY_ALIAS, INTERWEAVE_RELEASE_KEYSTORE_PASS,
#             INTERWEAVE_RELEASE_KEY_PASS (if it differs),
#             INTERWEAVE_RELEASE_CERT_SHA256 -- packaging/android/README.md,
#             "The signing key", says what each holds;
#   variable  INTERWEAVE_RELEASE_FIRST=true for the first release only,
#             with no INTERWEAVE_RELEASE_CERT_SHA256: the run passes
#             --first-release and prints the fingerprint to record, and the
#             variable is then removed. With neither, the signing refuses;
#   protection a deployment rule admitting only v* tags, and a required
#             reviewer. The tag check below runs from the tagged commit's
#             own copy of this file, so a writer who tags a commit with an
#             edited copy skips it; only the environment's protection
#             keeps the key from such a run.

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'MAJOR.MINOR.PATCH to build as, without the v (a dry run: nothing is signed or published)'
        required: true
        type: string

permissions:
  contents: read

# bash -eo pipefail, which an unset shell is not.
defaults:
  run:
    shell: bash

concurrency:
  # One run per tag, never cancelled: a half-published release is worse
  # than a second run refused by gh release create. The trigger is in the
  # group, so a dry run never queues behind, or displaces, a tag's run.
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # A dispatch's version is checked as a tag would be; it reaches the
      # script through the environment, never into the script's text.
      TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
      EVENT: ${{ github.event_name }}
      REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # main's history, to ask whether the tag is on it.
          fetch-depth: 0

      # The trigger's glob admits v1.2.3-rc1 and v01.2.3; the scripts take
      # MAJOR.MINOR.PATCH and refuse the rest, but a tag off main would
      # pass them. Both are refused here, and every other job needs this.
      # A dry run is held to the same, and is dispatched from main itself:
      # a branch whose head is on main's history would pass the ancestry
      # check alone. A refused version is printed %q-quoted, since a
      # dispatched one is typed text and a newline in it would otherwise
      # start a workflow command of its own in the log.
      - name: The tag is v<MAJOR>.<MINOR>.<PATCH> and on main
        id: version
        run: |
          if [[ "$EVENT" == workflow_dispatch && "$REF" != refs/heads/main ]]; then
            printf '::error::a dry run is dispatched from main, not %q\n' "$REF"; exit 1
          fi
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { printf '::error::tag %q is not v<MAJOR>.<MINOR>.<PATCH>\n' "$TAG"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { printf '::error::tag %q (%s) is not on main\n' "$TAG" "$GITHUB_SHA"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  apk:
    name: release apk build (arm64-v8a)
    needs: tag
    # Never on a dry run: it builds only what a host install reads.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cargo or Gradle cache, deliberately: skia_prebuilt.sh check
      # reads every skia-bindings output of the release profile, and a
      # restored target can carry one the build did not take. A release
      # builds from nothing.
      - name: Install the pinned JDK, SDK packages, Rust target and cargo-ndk
        run: bash tools/ci/android_ci_toolchain.sh jdk sdk rust cargo-ndk

      # Step 2: the one Skia archive the pin names, its SHA-256 checked.
      - name: Skia, pinned
        run: |
          out=$(bash tools/ci/skia_prebuilt.sh fetch "$RUNNER_TEMP/skia") || exit 1
          printf '%s\n' "$out"
          line=$(printf '%s\n' "$out" | grep '^SKIA_BINARIES_URL=file://') || true
          [ "$(printf '%s' "$line" | grep -c .)" = 1 ] \
            || { echo "::error::skia_prebuilt.sh fetch printed no single SKIA_BINARIES_URL line"; exit 1; }
          printf '%s\n' "$line" >> "$GITHUB_ENV"

      # Step 3. Gradle runs cargo-ndk --release for arm64-v8a.
      - name: ./gradlew assembleRelease
        working-directory: apps/human-android/android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      # Step 4: a silent fallback to a source build is a red run.
      - name: Skia, checked
        run: bash tools/ci/skia_prebuilt.sh check target release

      # Step 7, here because an ndk: source reads this job's SDK. The
      # script writes its file and makes no directory for it.
      - name: The notices
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 tools/ci/skia_notices.py "$RUNNER_TEMP/out/notices.json"

      # ADR-0058 decision 5 (A 2026-10-22 (ii)): the notices of every crate
      # compiled into the native library, made by the tool and rule the
      # Linux archive's are, as THIRD-PARTY-NOTICES-android.md, a release
      # asset beside the APK -- about six times what a release body takes,
      # so the page holds only its link and hash (crate-notices.json). The
      # link is the release's download URL, run.json's base for the APK.
      # No build needed: cargo resolves the library's graph from the lock.
      - name: The native library's crate notices
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          bash tools/ci/release_crate_notices.sh aarch64-linux-android interweave-human-android \
            "$VERSION" "$RUNNER_TEMP/out" "$BASE"

      # One directory for the artifact: given paths in two, upload-artifact
      # roots it at their common ancestor, and the files arrive nested
      # under it rather than where sign and publish read them.
      - name: The unsigned APK beside the notices
        run: cp apps/human-android/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/out/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-unsigned
          path: |
            ${{ runner.temp }}/out/app-release-unsigned.apk
            ${{ runner.temp }}/out/notices.json
            ${{ runner.temp }}/out/crate-notices.json
            ${{ runner.temp }}/out/THIRD-PARTY-NOTICES-android.md
            ${{ runner.temp }}/out/THIRD-PARTY-NOTICES-android.md.sha256
          if-no-files-found: error
          retention-days: 7

  sign:
    name: release apk signing
    # After every check job, linux included: a run refused at any check
    # (the Linux archive's notices, say) leaves no signed APK, not even as
    # a run artifact.
    needs: [tag, apk, linux]
    # Never on a dry run: the job that reads the key runs only for a tag.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The JDK for keytool, the SDK for build-tools and android.jar; no
      # build runs in this job.
      - name: Install the pinned JDK and SDK packages
        run: bash tools/ci/android_ci_toolchain.sh jdk sdk

      # release_android_apk.sh otherwise takes the newest build-tools
      # under $ANDROID_HOME, which is the runner image's, not the pin's.
      - name: The pinned build-tools for signing
        run: |
          v=$(sed -n 's/^PKG_[0-9]*=build-tools;\([^@]*\)@.*/\1/p' tools/host/android/android-toolchain.pins | sort -V | tail -n 1)
          [ -n "$v" ] && [ -d "$ANDROID_HOME/build-tools/$v" ] \
            || { echo "::error::no pinned build-tools in $ANDROID_HOME"; exit 1; }
          echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/$v" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-unsigned
          path: ${{ runner.temp }}/unsigned

      # Step 5. The keystore is a file only this job reads, under the
      # runner's temporary directory, and is removed however the job ends
      # (the step after). The passwords stay in the environment; the
      # script hands them to apksigner as env: references.
      - name: Signing
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          KEYSTORE_B64: ${{ secrets.INTERWEAVE_RELEASE_KEYSTORE_BASE64 }}
          INTERWEAVE_RELEASE_KEY_ALIAS: ${{ secrets.INTERWEAVE_RELEASE_KEY_ALIAS }}
          INTERWEAVE_RELEASE_KEYSTORE_PASS: ${{ secrets.INTERWEAVE_RELEASE_KEYSTORE_PASS }}
          INTERWEAVE_RELEASE_KEY_PASS: ${{ secrets.INTERWEAVE_RELEASE_KEY_PASS }}
          INTERWEAVE_RELEASE_CERT_SHA256: ${{ secrets.INTERWEAVE_RELEASE_CERT_SHA256 }}
          FIRST_RELEASE: ${{ vars.INTERWEAVE_RELEASE_FIRST }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::the release environment has no INTERWEAVE_RELEASE_KEYSTORE_BASE64"; exit 1; }
          export INTERWEAVE_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          ( umask 077 && printf '%s' "$KEYSTORE_B64" | base64 -d > "$INTERWEAVE_RELEASE_KEYSTORE" ) \
            || { echo "::error::INTERWEAVE_RELEASE_KEYSTORE_BASE64 is not base64"; exit 1; }
          first=()
          [ "$FIRST_RELEASE" = true ] && first=(--first-release)
          bash tools/ci/release_android_apk.sh "${first[@]}" "$VERSION" \
            "$RUNNER_TEMP/unsigned/app-release-unsigned.apk" "$RUNNER_TEMP/out"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: |
            ${{ runner.temp }}/out/interweave-*-arm64-v8a.apk
            ${{ runner.temp }}/out/interweave-*-arm64-v8a.apk.sha256
            ${{ runner.temp }}/out/android-values.json
          if-no-files-found: error
          # The signed APK, kept a day: publish runs straight after this
          # job, and a publish re-run later than that is a full re-run,
          # which signs again behind the environment's required reviewer.
          retention-days: 1

  linux:
    name: release archive (x86_64-unknown-linux-gnu)
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Step 6. The archive script also writes the archive's
      # THIRD-PARTY-NOTICES.md: it runs tools/ci/release_notices.py over
      # `cargo tree --locked` of the packages it ships and `cargo
      # metadata --locked`, and a failure there fails this step with no
      # archive left behind. Not a step of its own: the notices are a file
      # inside the archive, built from the archive's own scratch.
      - name: The Linux archive
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: bash tools/ci/release_linux_archive.sh "$VERSION" "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            ${{ runner.temp }}/out/interweave-*-x86_64-unknown-linux-gnu.tar.gz
            ${{ runner.temp }}/out/interweave-*-x86_64-unknown-linux-gnu.tar.gz.sha256
            ${{ runner.temp }}/out/linux-values.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the release
    needs: [tag, apk, sign, linux]
    # Never on a dry run, which publishes nothing.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The signed APK, the archive and their values; the notices from the
      # build. The unsigned APK comes along and is never published.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/in
          merge-multiple: true

      # run.json: the version, the notes and the two download URLs. The
      # notes are the tag's whole message, its first paragraph included,
      # so the tag must be annotated: a lightweight tag would publish the
      # commit's message as notes.
      - name: The run's values
        env:
          REPO: ${{ github.repository }}
        run: |
          # The tag object itself, whatever form checkout left the ref in.
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git cat-file -t "refs/tags/$TAG")" = tag ] \
            || { echo "::error::$TAG is not an annotated tag; its message is the release notes"; exit 1; }
          # %(contents) is the message as written, with a signed tag's
          # signature after it; the signature is not notes.
          notes=$(git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d')
          base="https://github.com/$REPO/releases/download/$TAG"
          jq -n --arg v "$VERSION" --arg n "$notes" \
            --arg a "$base/interweave-$VERSION-arm64-v8a.apk" \
            --arg l "$base/interweave-$VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            '{version: $v, release_notes: $n, apk_url: $a, linux_archive_url: $l}' > "$RUNNER_TEMP/run.json"

      # Step 8: refuses a gap, a stray value, a value two files give, and
      # a hash made for another version.
      - name: The page
        run: |
          in="$RUNNER_TEMP/in"
          python3 tools/ci/release_page.py apps/human-android/release/release-page.md.in \
            "$RUNNER_TEMP/page.md" "$RUNNER_TEMP/run.json" \
            "$in/android-values.json" "$in/linux-values.json" "$in/notices.json" \
            "$in/crate-notices.json"

      # Before anything is created: a page the API would refuse fails here,
      # its size and the limit named, not at gh release create with the tag
      # already pushed (ADR-0058 A 2026-10-22 (ii)).
      - name: The page fits a release body
        run: bash tools/ci/check_release_body.sh "$RUNNER_TEMP/page.md"

      # Step 9. --verify-tag: the release is the pushed tag's, never one
      # gh would create at another commit.
      - name: Publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          in="$RUNNER_TEMP/in"
          gh release create "$TAG" --verify-tag --title "InterWeave $VERSION" \
            --notes-file "$RUNNER_TEMP/page.md" \
            "$in"/interweave-*-arm64-v8a.apk "$in"/interweave-*-arm64-v8a.apk.sha256 \
            "$in"/interweave-*-x86_64-unknown-linux-gnu.tar.gz "$in"/interweave-*-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            "$in"/THIRD-PARTY-NOTICES-android.md "$in"/THIRD-PARTY-NOTICES-android.md.sha256
